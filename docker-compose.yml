# Services AST-RAG needs, matching the defaults in ast_rag/dto/config.py.
#
#   docker compose up -d
#
# Nothing else to configure: with these running, `ast-rag` works with no
# config file at all. Override per environment with AST_RAG_NEO4J_URI /
# AST_RAG_NEO4J_PASSWORD / AST_RAG_QDRANT_URL rather than editing a file.

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: ast_rag_neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # cypher-shell exits non-zero until Bolt is actually serving, which is
      # later than the container being "up".
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ast_rag_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
